name: Deploy test environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: 'Deploy infrastructure (auto = compare with the last successful infrastructure deployment)'
        type: choice
        options: [auto, 'true', 'false']
        default: auto
      deploy_api:
        description: 'Deploy the Functions API (auto = compare with the last successful API deployment)'
        type: choice
        options: [auto, 'true', 'false']
        default: auto

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: journey-test-environment
  cancel-in-progress: false

jobs:
  plan:
    name: Plan deployment
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      deploy_infra: ${{ steps.decide.outputs.deploy_infra }}
      deploy_api: ${{ steps.decide.outputs.deploy_api }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Test deployment planning
        run: node --test .github/scripts/plan-test-deployment.test.mjs

      - name: Decide what to deploy
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_DEPLOY_INFRA: ${{ inputs.deploy_infra }}
          INPUT_DEPLOY_API: ${{ inputs.deploy_api }}
        run: node .github/scripts/plan-test-deployment.mjs

  deploy:
    name: Deploy journey test environment
    if: github.event.action != 'closed'
    needs: plan
    uses: ./.github/workflows/deploy-environment.yml
    with:
      github_environment: hh-env-test
      default_data_mode: demo-cosmos
      bicep_environment_name: dev
      deployment_heading: Journey test environment
      deploy_infra: ${{ needs.plan.outputs.deploy_infra == 'true' }}
      deploy_api: ${{ github.event_name == 'workflow_dispatch' && needs.plan.outputs.deploy_api == 'true' }}
      deploy_application: ${{ github.event_name == 'workflow_dispatch' }}
      run_cosmos_test: true
    secrets: inherit

  close_preview:
    name: Close test preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: hh-env-test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read deployment token
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
        run: |
          set -euo pipefail
          token="$(az staticwebapp secrets list \
            --name "${STATIC_WEB_APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query 'properties.apiKey' --output tsv)"
          echo "::add-mask::${token}"
          echo "SWA_DEPLOYMENT_TOKEN=${token}" >> "$GITHUB_ENV"

      - name: Close Azure Static Web Apps preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: close
