name: Deploy test environment

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: 'Deploy infrastructure (auto = only when infra/ or deployment workflows changed since the last successful test deploy)'
        type: choice
        options: [auto, 'true', 'false']
        default: auto
      deploy_api:
        description: 'Deploy the Functions API (auto = only when api/ or infra/ changed since the last successful test deploy)'
        type: choice
        options: [auto, 'true', 'false']
        default: auto

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: journey-test-environment
  cancel-in-progress: false

jobs:
  plan:
    name: Plan deployment
    runs-on: ubuntu-latest
    outputs:
      deploy_infra: ${{ steps.decide.outputs.deploy_infra }}
      deploy_api: ${{ steps.decide.outputs.deploy_api }}
    steps:
      - name: Reject workflow dispatch from main
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          echo "::error::Test deploys can only be dispatched from a branch other than main."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide what to deploy
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_DEPLOY_INFRA: ${{ inputs.deploy_infra }}
          INPUT_DEPLOY_API: ${{ inputs.deploy_api }}
        run: |
          set -euo pipefail

          deploy_infra="${INPUT_DEPLOY_INFRA:-auto}"
          deploy_api="${INPUT_DEPLOY_API:-auto}"
          echo "### Deploy test environment plan" >> "$GITHUB_STEP_SUMMARY"

          if [ "${deploy_infra}" != "auto" ] && [ "${deploy_api}" != "auto" ]; then
            echo "deploy_infra=${deploy_infra}" >> "$GITHUB_OUTPUT"
            echo "deploy_api=${deploy_api}" >> "$GITHUB_OUTPUT"
            {
              echo "\`deploy_infra\` input explicitly set to \`${deploy_infra}\`."
              echo "\`deploy_api\` input explicitly set to \`${deploy_api}\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          last_success_sha="$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/deploy-test.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')"

          if [ -z "${last_success_sha}" ]; then
            auto_deploy_infra=true
            auto_deploy_api=true
            echo "No previous successful run found; deploying infrastructure and the API (fail safe)." >> "$GITHUB_STEP_SUMMARY"
          elif ! git cat-file -e "${last_success_sha}^{commit}" 2>/dev/null; then
            auto_deploy_infra=true
            auto_deploy_api=true
            echo "Last successful commit ${last_success_sha} is not reachable in history; deploying infrastructure and the API (fail safe)." >> "$GITHUB_STEP_SUMMARY"
          else
            changed_paths="$(git diff --name-only "${last_success_sha}...HEAD")"
            {
              echo "Changed paths since last successful run (${last_success_sha}):"
              echo '```'
              echo "${changed_paths:-<none>}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            if echo "${changed_paths}" | grep -qE '^(infra/|\.github/workflows/(deploy-test|deploy-environment)\.yml)'; then
              auto_deploy_infra=true
            else
              auto_deploy_infra=false
            fi

            if echo "${changed_paths}" | grep -qE '^(api/|infra/|staticwebapp\.config\.json|\.github/workflows/(deploy-test|deploy-environment)\.yml)'; then
              auto_deploy_api=true
            else
              auto_deploy_api=false
            fi
          fi

          if [ "${deploy_infra}" = "auto" ]; then
            deploy_infra="${auto_deploy_infra}"
          fi
          if [ "${deploy_api}" = "auto" ]; then
            deploy_api="${auto_deploy_api}"
          fi

          echo "deploy_infra=${deploy_infra}" >> "$GITHUB_OUTPUT"
          echo "deploy_api=${deploy_api}" >> "$GITHUB_OUTPUT"
          echo "Decision: deploy_infra=${deploy_infra}, deploy_api=${deploy_api}." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy journey test environment
    needs: plan
    uses: ./.github/workflows/deploy-environment.yml
    with:
      github_environment: hh-env-test
      bicep_environment_name: dev
      deployment_heading: Journey test environment
      deploy_infra: ${{ needs.plan.outputs.deploy_infra == 'true' }}
      deploy_api: ${{ needs.plan.outputs.deploy_api == 'true' }}
      deploy_application: true
    secrets: inherit
