name: Deploy test environment

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      deploy_api:
        description: 'Deploy the Functions API (auto = only when api/ or infra/ changed since the last successful test deploy)'
        type: choice
        options: [auto, 'true', 'false']
        default: auto

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: deploy-test-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan deployment
    runs-on: ubuntu-latest
    outputs:
      deploy_api: ${{ steps.decide.outputs.deploy_api }}
    steps:
      - name: Reject workflow dispatch from main
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          echo "::error::Test deploys can only be dispatched from a branch other than main."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether to deploy the API
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_DEPLOY_API: ${{ inputs.deploy_api }}
        run: |
          set -euo pipefail

          if [ "${INPUT_DEPLOY_API}" = "true" ] || [ "${INPUT_DEPLOY_API}" = "false" ]; then
            echo "deploy_api=${INPUT_DEPLOY_API}" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy test environment plan"
              echo "\`deploy_api\` input explicitly set to \`${INPUT_DEPLOY_API}\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          last_success_sha="$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/deploy-test.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')"

          echo "### Deploy test environment plan" >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${last_success_sha}" ]; then
            echo "deploy_api=true" >> "$GITHUB_OUTPUT"
            echo "No previous successful run found; deploying the API (fail safe)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! git cat-file -e "${last_success_sha}^{commit}" 2>/dev/null; then
            echo "deploy_api=true" >> "$GITHUB_OUTPUT"
            echo "Last successful commit ${last_success_sha} is not reachable in history; deploying the API (fail safe)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          changed_paths="$(git diff --name-only "${last_success_sha}...HEAD")"
          {
            echo "Changed paths since last successful run (${last_success_sha}):"
            echo '```'
            echo "${changed_paths:-<none>}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if echo "${changed_paths}" | grep -qE '^(api/|infra/|staticwebapp\.config\.json|\.github/workflows/(deploy-test|deploy-environment)\.yml)'; then
            echo "deploy_api=true" >> "$GITHUB_OUTPUT"
            echo "Decision: deploy the API (relevant paths changed)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy_api=false" >> "$GITHUB_OUTPUT"
            echo "Decision: skip the API deploy (only frontend files changed)." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy journey test environment
    needs: plan
    uses: ./.github/workflows/deploy-environment.yml
    with:
      github_environment: hh-env-test
      bicep_environment_name: dev
      deployment_heading: Journey test environment
      deploy_api: ${{ needs.plan.outputs.deploy_api == 'true' }}
      deploy_application: true
    secrets: inherit
