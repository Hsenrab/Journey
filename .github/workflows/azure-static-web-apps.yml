name: Deploy Azure Static Web App

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: journey-production-environment
  cancel-in-progress: false

jobs:
  guard:
    name: Guard production dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Reject workflow_dispatch from a non-main branch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deploys can only be dispatched from the main branch. Use the 'Deploy test environment' workflow for branch testing."
          exit 1

  deploy:
    name: Deploy production environment
    needs: guard
    uses: ./.github/workflows/deploy-environment.yml
    with:
      github_environment: hh-env
      bicep_environment_name: prod
      deployment_heading: Azure Static Web App
      deploy_infra: true
      deploy_api: true
      deploy_application: true
    secrets: inherit
